name: Build MuTube
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: |
          mkdir ipa
          curl -L -o ipa/YouTube_4.54.01_decrypted.ipa "https://r2.dev"
          make
      - uses: actions/upload-artifact@v4
        with:
          name: mutube-fixed-ipa
          path: "*.ipa"
